# Upstream dependency manifest
#
# Every entry here is tracked by `make graphql-web`. Add entries here,
# not in ad-hoc code.
#
# Schema:
#   orgs:<key>:
#     type: github-org
#     url: <GitHub org URL>
#     watched_repos: [{name, pin, reason}]
#   pages:<list>:
#     url: <markdown URL>
#     snapshot: <relative path>
#     sha256: <hex>
#     last_seen: <YYYY-MM-DD>
#     downstream: [<relative paths the snapshot informs>]

pinned_cli: "@anthropic-ai/claude-code@2.1.114"
pinned_agent_sdk_floor: "@anthropic-ai/claude-agent-sdk@0.2.111"
pinned_anthropic_sdk_ts: "@anthropic-ai/sdk@0.90.0"
pinned_node: ">=20"   # raised from 18 → 20 for @octokit/graphql@9.x
pinned_octokit_graphql: "@octokit/graphql@9.0.3"
pinned_octokit_paginate_graphql: "@octokit/plugin-paginate-graphql@6.0.0"
pinned_octokit_graphql_schema: "@octokit/graphql-schema@15.26.1"
pinned_markdown_it: "markdown-it@14.1.1"
pinned_markdown_it_anchor: "markdown-it-anchor@9.2.0"
pinned_markdown_it_front_matter: "markdown-it-front-matter@0.2.4"

orgs:
  anthropics:
    type: github-org
    url: https://github.com/orgs/anthropics/repositories
    watched_repos:
      - { name: claude-code,                   pin: v2.1.114,  reason: "CLI we pin this repo to" }
      - { name: claude-agent-sdk-typescript,   pin: v0.2.111,  reason: "Agent SDK floor for Opus 4.7" }
      - { name: claude-agent-sdk-python,       pin: v0.2.111,  reason: "Python Agent SDK parity" }
      - { name: claude-agent-sdk-demos,        pin: main,      reason: "reference agent examples" }
      - { name: anthropic-sdk-typescript,      pin: v0.90.0,   reason: "Messages API client" }
      - { name: anthropic-sdk-python,          pin: latest,    reason: "Python Messages client" }
      - { name: anthropic-sdk-go,              pin: latest,    reason: "Go Messages client" }
      - { name: skills,                        pin: main,      reason: "canonical skill shape" }
      - { name: claude-cookbooks,              pin: main,      reason: "reference patterns" }

  modelcontextprotocol:
    type: github-org
    url: https://github.com/orgs/modelcontextprotocol/repositories
    watched_repos:
      - { name: modelcontextprotocol, pin: main, reason: "MCP spec" }
      - { name: servers,              pin: main, reason: "reference MCP servers (github, filesystem, etc.)" }
      - { name: typescript-sdk,       pin: main, reason: "MCP TS SDK" }
      - { name: python-sdk,           pin: main, reason: "MCP Python SDK" }
      - { name: inspector,            pin: main, reason: "debug MCP servers locally" }

  neondatabase:
    type: github-org
    url: https://github.com/orgs/neondatabase/repositories
    watched_repos:
      - { name: neon,           pin: latest, reason: "serverless Postgres — routine/cloud backing store candidate" }
      - { name: serverless,     pin: latest, reason: "neon serverless driver" }
      - { name: toolkit,        pin: latest, reason: "neon MCP / admin tooling" }

  postgres:
    type: github-org
    url: https://github.com/postgres
    watched_repos:
      - { name: postgres,       pin: REL_16_STABLE, reason: "Postgres source of truth; we pin against 16.x which is what claude-code-on-the-web preinstalls" }

  redis:
    type: github-org
    url: https://github.com/orgs/redis/repositories
    watched_repos:
      - { name: redis,          pin: 7.4,   reason: "upstream; cloud env preinstalls redis-server" }
      - { name: node-redis,     pin: latest, reason: "node client if/when we add server-side code" }

  docker:
    type: github-org
    url: https://github.com/orgs/docker/repositories
    watched_repos:
      - { name: docker-ce,      pin: latest, reason: "Docker Engine; docker + docker compose available in cloud env per /en/claude-code-on-the-web" }
      - { name: compose,        pin: v2,     reason: "docker compose v2" }
      - { name: buildx,         pin: latest, reason: "multi-arch builds" }

  decoderesearch:
    type: github-org
    url: https://github.com/orgs/decoderesearch/repositories
    watched_repos: []
    reason: "watch-only: research org in Anthropic orbit; no pins yet"

  safety-research:
    type: github-org
    url: https://github.com/orgs/safety-research/repositories
    watched_repos: []
    reason: "watch-only: alignment / safety org; may produce evals we want to adopt"

  AndonLabs:
    type: github-user
    url: https://github.com/AndonLabs
    watched_repos: []
    reason: "watch-only: eval + scaffold research"

  graphql:
    type: github-org
    url: https://github.com/orgs/graphql/repositories
    watched_repos:
      - { name: graphql-spec,  pin: main, reason: "canonical GraphQL spec" }
      - { name: graphql-js,    pin: latest, reason: "reference JS implementation" }
    reason: "GraphQL Foundation — canonical spec + reference impls"

  octokit:
    type: github-org
    url: https://github.com/orgs/octokit/repositories
    watched_repos:
      - { name: graphql.js,                    pin: v9.0.3,  reason: "JS GraphQL client — pinned to package.json" }
      - { name: plugin-paginate-graphql.js,    pin: v6.0.0,  reason: "paginate plugin — pinned to package.json" }
      - { name: graphql-schema,                pin: v15.26.1, reason: "GitHub GraphQL schema + validation — pinned" }
      - { name: graphql-action,                pin: latest,  reason: "GH Actions workflow step for GraphQL" }
      - { name: octokit.js,                    pin: latest,  reason: "umbrella client; reference for our standalone usage" }
      - { name: rest.js,                       pin: latest,  reason: "REST client — reference for when GraphQL isn't right" }
    reason: "Official GitHub-maintained client libs"

  markdown-it:
    type: github-org
    url: https://github.com/markdown-it
    watched_repos:
      - { name: markdown-it,                  pin: v14.1.1, reason: "pinned to package.json" }
      - { name: markdown-it-anchor,           pin: v9.2.0,  reason: "pinned to package.json" }
      - { name: markdown-it-front-matter,     pin: v0.2.4,  reason: "pinned to package.json" }
    reason: "Markdown parser we use in docs-librarian regeneration"

wellarchitected:
  source: https://wellarchitected.github.com/library/
  release: "2026-Q1"
  release_notes: https://wellarchitected.github.com/library/overview/release-notes/#2026-q1
  status: "anchored — drift-checked via pages[*] entries below; every D-level decision in the plan cites a WA page"
  # Full URLs are tracked under pages:[] above so make graphql-web
  # picks up any drift in the 2026-Q1 release notes or recommendations.
  recommendations_q1_2026:
    new:
      - implementing-polyrepo-engineering
      - managing-dependency-threats
      - expanding-enterprise-custom-agents-context
    updated:
      - nist-ssdf-implementation
      - actions-security
      - design-principles
      - anti-patterns

neon:
  source: https://neon.com/guides/isolated-subagents-neon-branching
