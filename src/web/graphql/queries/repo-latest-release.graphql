# Fetch the latest release tag + published date for a repo.
# Cost: 1 point. Used by .claude/scripts/graphql-deps.sh.
query RepoLatestRelease($owner: String!, $repo: String!) {
  repository(owner: $owner, name: $repo) {
    nameWithOwner
    defaultBranchRef {
      target {
        ... on Commit {
          oid
          committedDate
        }
      }
    }
    releases(first: 1, orderBy: {field: CREATED_AT, direction: DESC}) {
      nodes {
        tagName
        publishedAt
        isPrerelease
      }
    }
  }
  rateLimit {
    cost
    remaining
    resetAt
  }
}
