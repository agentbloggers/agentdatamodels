<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>video-chat · agentdatamodels</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --paper: #f5f3ee;
    --paper-2: #ece8df;
    --ink: #1a1a1a;
    --accent: oklch(0.70 0.15 70);
  }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif; height: 100%; }
  * { box-sizing: border-box; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px;
    max-width: 1280px; margin: 0 auto; height: 100vh; }
  .stage { display: flex; flex-direction: column; gap: 8px; }
  video { width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 8px;
    object-fit: cover; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .controls button { padding: 8px 14px; border: 1px solid var(--ink); background: var(--paper-2);
    font-family: inherit; cursor: pointer; border-radius: 4px; }
  .controls button:disabled { opacity: 0.4; cursor: not-allowed; }
  #status { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px;
    padding: 6px 10px; background: var(--paper-2); border-radius: 4px; flex: 1 0 auto; }
  .panel { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  #transcript { flex: 1; overflow-y: auto; background: var(--paper-2); border-radius: 8px;
    padding: 12px; font-size: 14px; line-height: 1.5; min-height: 0; }
  .row { display: grid; grid-template-columns: 80px 1fr; gap: 8px; margin-bottom: 8px; }
  .row .r { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px;
    text-transform: uppercase; color: #666; padding-top: 2px; }
  .row-user .r { color: var(--accent); }
  .composer { display: flex; gap: 8px; }
  .composer input { flex: 1; padding: 8px 10px; border: 1px solid var(--ink);
    background: var(--paper); font-family: inherit; border-radius: 4px; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 12px 16px;
    border-bottom: 1px solid var(--paper-2); }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; }
  header .sub { font-size: 12px; color: #666;
    font-family: 'JetBrains Mono', ui-monospace, monospace; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; height: auto; } }
</style>
</head>
<body>
<header>
  <h1>video-chat</h1>
  <span class="sub">gemini live × anam — src/live/video-chat</span>
</header>
<main>
  <section class="stage">
    <video id="avatar-video" playsinline autoplay muted></video>
    <audio id="avatar-audio" autoplay></audio>
    <div class="controls">
      <button id="start">Start</button>
      <button id="stop" disabled>Stop</button>
      <span id="status">idle</span>
    </div>
  </section>
  <section class="panel">
    <div id="transcript" aria-live="polite"></div>
    <div class="composer">
      <input id="user-text" placeholder="type a message (mic is also live)" />
      <button id="send">Send</button>
    </div>
  </section>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
